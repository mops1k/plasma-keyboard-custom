version = 1
SPDX-PackageName = "plasma-keyboard"
SPDX-PackageDownloadLocation = "https://invent.kde.org/plasma/plasma-keyboard!"

[[annotations]]
path = "**.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "KDE contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# The word lists of the predictive text input are generated from the
# FrequencyWords lists (https://github.com/hermitdave/FrequencyWords), which
# Hermit Dave publishes under the MIT licence.
[[annotations]]
path = "src/prediction/data/**.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Aleksandr Kvintilyanov <bednyj.mops@gmail.com>", "2016 Hermit Dave"]
SPDX-License-Identifier = "MIT"

# The bigram lists of the predictive text input are counted in the Tatoeba
# sentence corpus (https://tatoeba.org), whose sentences Tatoeba publishes under
# the Creative Commons Attribution 2.0 France licence (CC BY 2.0 FR). The
# licence has no SPDX identifier of its own, so it is referred to by name.
[[annotations]]
path = "src/prediction/data/*.ngrams"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Aleksandr Kvintilyanov <bednyj.mops@gmail.com>", "Tatoeba contributors"]
SPDX-License-Identifier = "LicenseRef-CC-BY-2.0-FR"

# The keyboard icons are shipped inside the application so that the look of the
# keyboard does not depend on the icon theme of the system.
#
# Most of them are taken from the Papirus icon theme
# (https://github.com/PapirusDevelopmentTeam/papirus-icon-theme), which the
# Papirus Development Team publishes under the GPL-3.0-only. The icons that
# Papirus does not have (the Shift states, hiding the keyboard and the text
# selection mode) are taken from the Breeze icon theme
# (https://invent.kde.org/frameworks/breeze-icons), which KDE publishes under
# the LGPL-3.0-or-later.
[[annotations]]
path = "src/icons/papirus/**.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Papirus Development Team"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "src/icons/breeze/**.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "KDE contributors"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# The landing page published on the gh-pages branch; its sources live in site/.
# The screenshots are of the keyboard itself, taken by the fork's author.
[[annotations]]
path = "site/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Aleksandr Kvintilyanov <bednyj.mops@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only OR GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"

# The swipe engine is vendored from the MIT-licensed Swipe Keyboard project
# (https://github.com/itsdestin/swipe-keyboard); its sources keep their own
# SPDX headers. The neural swipe model is MIT as well and was trained on the
# MIT-licensed FUTO swipe data set, whose licence text travels with it.
[[annotations]]
path = "src/swipekb/model/swipe-model.bin"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Destin Moss <https://youcoded.ai>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/swipekb/model/FUTO-SWIPE-DATA-LICENSE.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 FUTO"
SPDX-License-Identifier = "MIT"
